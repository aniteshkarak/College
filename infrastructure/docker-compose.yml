version: '3.8'

services:
  # Primary Database: PostgreSQL 16 Alpine
  postgres:
    image: postgres:16-alpine
    container_name: college-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-college_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-college_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-college_db}
    ports:
      # Safe loopback-only binding to prevent public exposure
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-college_user} -d ${POSTGRES_DB:-college_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache, Online Status & BullMQ Broker: Redis 7 Alpine
  redis:
    image: redis:7-alpine
    container_name: college-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Safe loopback-only binding to prevent public exposure
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: college_postgres_data
  redis_data:
    name: college_redis_data
