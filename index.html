<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Collage Story – Meet, Chat and Connect with College Students</title>
    <meta name="description" content="Collage Story is a college-oriented social networking platform designed to help eligible students discover profiles, build connections and have meaningful conversations." />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Collage Story – Meet, Chat and Connect with College Students" />
    <meta property="og:description" content="Collage Story is a college-oriented social networking platform designed to help eligible students discover profiles, build connections and have meaningful conversations." />
    <meta property="og:image" content="/logo.svg" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Collage Story – Meet, Chat and Connect with College Students" />
    <meta name="twitter:description" content="Collage Story is a college-oriented social networking platform designed to help eligible students discover profiles, build connections and have meaningful conversations." />
    <meta name="twitter:image" content="/logo.svg" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- Anti-FOUC Theme Pre-loader -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('college_theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (storedTheme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
